<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Dodge</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* Modern Minimalist Dark Arcade Base Style */
        body {
            background-color: #050505;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Scoreboard Display Layout */
        .scoreboard {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 5px;
            box-sizing: border-box;
        }

        .score-box {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #A3A3A3;
        }

        .score-val {
            color: #FFFFFF;
            font-variant-numeric: tabular-nums;
            font-size: 15px;
            margin-left: 4px;
        }

        #highScoreVal {
            color: #3b82f6; /* Neon Blue Glow Highlighting */
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* Neon Frame Play Arena Canvas Container */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background-color: #0c0c0e;
            border: 2px solid #1c1c22;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Interactive Menu Overlay Layers */
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 18px;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #3b82f6, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc-text {
            color: #A3A3A3;
            font-size: 14px;
            margin: 0 0 24px 0;
            max-width: 240px;
            line-height: 1.4;
        }

        .action-btn {
            background-color: #FFFFFF;
            border: none;
            color: #050505;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.96);
            background-color: #E5E5E5;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Score Engine Display Grid -->
        <div class="scoreboard">
            <div class="score-box">Score:<span class="score-val" id="currentScoreVal">0</span></div>
            <div class="score-box">Best:<span class="score-val" id="highScoreVal">0</span></div>
        </div>

        <div class="canvas-container">
            <canvas id="gameCanvas" width="600" height="800"></canvas>
            
            <!-- Launch & Game Over Overlay Interface Screen Frame -->
            <div class="menu-overlay" id="menuOverlay">
                <h1 id="menuTitle">COSMIC DODGE</h1>
                <p class="desc-text" id="menuDesc">Drag anywhere to slide your fighter starship. Avoid the falling meteors!</p>
                <button class="action-btn" id="startBtn" onclick="initiateGameSession()">Launch Mission</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('menuOverlay');
        const menuTitle = document.getElementById('menuTitle');
        const menuDesc = document.getElementById('menuDesc');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('currentScoreVal');
        const highDisplay = document.getElementById('highScoreVal');

        // Core Configuration Game Vectors Layout Matrix
        let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
        let score = 0;
        let highScore = 0;
        let animationFrameId;

        // Player Entity Frame Setup
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            radius: 20,
            targetX: canvas.width / 2
        };

        let obstacles = [];
        let obstacleSpeedBase = 4;
        let spawnRate = 0.02; // Initial conditional loop probabilities tick thresholds

        // Load record data logs out of memory arrays instantly on init checks
        window.addEventListener('DOMContentLoaded', () => {
            const savedRecord = localStorage.getItem('cosmic_dodge_high');
            if (savedRecord) {
                highScore = parseInt(savedRecord, 10);
                highDisplay.innerText = highScore;
            }
        });

        // --- MOBILE TOUCH SCREEN CAPTURE POSITION DETECTOR ENGINE ---
        window.addEventListener('touchstart', handleTouchEvents);
        window.addEventListener('touchmove', handleTouchEvents);

        function handleTouchEvents(e) {
            if (gameState !== "PLAYING") return;
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                
                // Track ratio proportions mapping scale points dynamically inside bounding window wrappers
                const scaleX = canvas.width / rect.width;
                const canvasTouchX = (touch.clientX - rect.left) * scaleX;
                
                // Center boundaries locking restrictions buffers
                player.targetX = Math.min(Math.max(canvasTouchX, player.radius), canvas.width - player.radius);
            }
        }

        function initiateGameSession() {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            
            // State System Profile Resets
            gameState = "PLAYING";
            score = 0;
            scoreDisplay.innerText = score;
            obstacles = [];
            obstacleSpeedBase = 5;
            spawnRate = 0.025;
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;

            cancelAnimationFrame(animationFrameId);
            gameLoopEngineTick();
        }

        function triggerGameOverSequence() {
            gameState = "GAMEOVER";
            cancelAnimationFrame(animationFrameId);

            // Audit record metrics values against stored buffers
            if (score > highScore) {
                highScore = score;
                highDisplay.innerText = highScore;
                localStorage.setItem('cosmic_dodge_high', highScore.toString());
            }

            // Update UI view display elements frames
            menuTitle.innerText = "MISSION FAILED";
            menuTitle.style.background = "linear-gradient(135deg, #ef4444, #fca5a5)";
            menuDesc.innerText = `Your fighter was destroyed. \nFinal Score: ${score}`;
            startBtn.innerText = "Try Again";
            
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; }, 10);
        }

        // --- PRINCIPAL ARCHIVE GRAPHICS LOGIC RENDER LOOP TICK ENGINE ---
        function gameLoopEngineTick() {
            if (gameState !== "PLAYING") return;

            // 1. Clear Screen Canvas Frame Buffer
            ctx.fillStyle = '#0c0c0e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw clean subtle backdrop track matrix grid coordinates lines
            ctx.strokeStyle = '#141419';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }

            // 2. Linear Interpolation Interpolated Smooth Ship Tracker Math Transitions
            player.x += (player.targetX - player.x) * 0.25;

            // 3. Render Neon Blue Control Vector Player Starship Graphic
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#3b82f6';
            ctx.fillStyle = '#3b82f6';
            
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius); // Nose tip anchor index
            ctx.lineTo(player.x - player.radius, player.y + player.radius); // Wing tip left corner
            ctx.lineTo(player.x, player.y + player.radius * 0.4); // Engine exhaust center indents
            ctx.lineTo(player.x + player.radius, player.y + player.radius); // Wing tip right corner
            ctx.closePath();
            ctx.fill();

            // Highlight clean white cockpit trim layout
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius * 0.8);
            ctx.lineTo(player.x - 6, player.y);
            ctx.lineTo(player.x + 6, player.y);
            ctx.closePath();
            ctx.fill();

            // 4. Spawn Obstacles Meteors
            if (Math.random() < spawnRate) {
                const radius = Math.random() * 16 + 12; // Mapped sizes
                obstacles.push({
                    x: Math.random() * (canvas.width - radius * 2) + radius,
                    y: -radius,
                    radius: radius,
                    speed: Math.random() * 3 + obstacleSpeedBase
                });
            }

            // 5. Update and Draw Obstacles
            ctx.shadowColor = '#ef4444'; // Red plasma warning glow styling channels
            ctx.fillStyle = '#ef4444';

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed;

                // Render obstacle sphere graphics
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();

                // Collision Detection Loop Circle Math Framework Checks
                const distX = obs.x - player.x;
                const distY = obs.y - player.y;
                const distance = Math.sqrt(distX * distX + distY * distY);

                // Check overlap boundaries (padded slightly for visual forgiveness balances)
                if (distance < (obs.radius + player.radius * 0.75)) {
                    triggerGameOverSequence();
                    return;
                }

                // Delete items safely escaping the bottom map layout edges
                if (obs.y - obs.radius > canvas.height) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreDisplay.innerText = score;

                    // Progressively scale difficulty benchmarks as score climbs up
                    if (score % 15 === 0) {
                        obstacleSpeedBase += 0.4;
                        spawnRate += 0.003;
                    }
                }
            }

            // Reset glow state metrics parameters before recycling canvas loop frames
            ctx.shadowBlur = 0;
            animationFrameId = requestAnimationFrame(gameLoopEngineTick);
        }
    </script>
</body>
</html>
