<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cosmic Dodge</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        /* Immersive Universal View Setup Base */
        body {
            background-color: #050505;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Responsive Layout Engine Wrapper Container */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Floating HUD Scoreboard Display Overlays */
        .scoreboard {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 10px;
            box-sizing: border-box;
            z-index: 10;
        }

        .score-box {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #A3A3A3;
        }

        .score-val {
            color: #FFFFFF;
            font-variant-numeric: tabular-nums;
            font-size: 16px;
            margin-left: 4px;
        }

        #highScoreVal {
            color: #3b82f6;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        /* Flexible Canvas View Frame Sandbox */
        .canvas-container {
            position: relative;
            width: 100%;
            flex: 1; /* Automatically forces canvas to fill all remaining vertical viewport space on phones */
            background-color: #0c0c0e;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Immersive System Overlay Cover Panels */
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #3b82f6, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc-text {
            color: #A3A3A3;
            font-size: 14px;
            margin: 0 0 28px 0;
            max-width: 260px;
            line-height: 1.4;
        }

        .action-btn {
            background-color: #FFFFFF;
            border: none;
            color: #050505;
            padding: 16px 44px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            -webkit-tap-highlight-color: transparent;
        }

        /* --- IPAD TABLET VISUAL DIMENSION SCALING ENGINE --- */
        @media (min-width: 600px) and (min-height: 600px) {
            .game-wrapper {
                width: 460px; /* Expands table layout proportions wider */
                height: 720px; /* Makes canvas layout view considerably taller */
            }
            .canvas-container {
                border: 2px solid #1c1c22;
                border-radius: 24px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
                flex: none;
                height: 620px;
            }
            .menu-overlay {
                border-radius: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="scoreboard">
            <div class="score-box">Score:<span class="score-val" id="currentScoreVal">0</span></div>
            <div class="score-box">Best:<span class="score-val" id="highScoreVal">0</span></div>
        </div>

        <div class="canvas-container" id="arenaBox">
            <canvas id="gameCanvas"></canvas>
            
            <div class="menu-overlay" id="menuOverlay">
                <h1 id="menuTitle">COSMIC DODGE</h1>
                <p class="desc-text" id="menuDesc">Drag anywhere to slide your fighter starship. Avoid the falling meteors!</p>
                <button class="action-btn" id="startBtn" onclick="initiateGameSession()">Launch Mission</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const arena = document.getElementById('arenaBox');
        const overlay = document.getElementById('menuOverlay');
        const menuTitle = document.getElementById('menuTitle');
        const menuDesc = document.getElementById('menuDesc');
        const startBtn = document.getElementById('startBtn');
        const scoreDisplay = document.getElementById('currentScoreVal');
        const highDisplay = document.getElementById('highScoreVal');

        let gameState = "MENU"; 
        let score = 0;
        let highScore = 0;
        let animationFrameId;

        // Reactive tracking coordinates dimensions bounds
        const player = { x: 0, y: 0, radius: 18, targetX: 0 };
        let obstacles = [];
        let obstacleSpeedBase = 5;
        let spawnRate = 0.025;

        // Auto-Resize Resolution Calibration Engine
        function dynamicallyScaleGameCanvas() {
            canvas.width = arena.clientWidth * window.devicePixelRatio;
            canvas.height = arena.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            
            player.y = (canvas.height / window.devicePixelRatio) - 70;
            if (gameState === "MENU") {
                player.x = (canvas.width / window.devicePixelRatio) / 2;
                player.targetX = player.x;
            }
        }

        window.addEventListener('resize', dynamicallyScaleGameCanvas);

        window.addEventListener('DOMContentLoaded', () => {
            dynamicallyScaleGameCanvas();
            const savedRecord = localStorage.getItem('cosmic_dodge_high');
            if (savedRecord) {
                highScore = parseInt(savedRecord, 10);
                highDisplay.innerText = highScore;
            }
        });

        window.addEventListener('touchstart', handleTouchEvents);
        window.addEventListener('touchmove', handleTouchEvents);

        function handleTouchEvents(e) {
            if (gameState !== "PLAYING") return;
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                const rect = canvas.getBoundingClientRect();
                const currentWidth = canvas.width / window.devicePixelRatio;
                
                // Track finger point coordinates offsets mapping ratios
                const canvasTouchX = ((touch.clientX - rect.left) / rect.width) * currentWidth;
                player.targetX = Math.min(Math.max(canvasTouchX, player.radius), currentWidth - player.radius);
            }
        }

        function initiateGameSession() {
            dynamicallyScaleGameCanvas();
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
            
            gameState = "PLAYING";
            score = 0;
            scoreDisplay.innerText = score;
            obstacles = [];
            obstacleSpeedBase = 5.5;
            spawnRate = 0.028;
            
            const currentW = canvas.width / window.devicePixelRatio;
            player.x = currentW / 2;
            player.targetX = currentW / 2;

            cancelAnimationFrame(animationFrameId);
            gameLoopEngineTick();
        }

        function triggerGameOverSequence() {
            gameState = "GAMEOVER";
            cancelAnimationFrame(animationFrameId);

            if (score > highScore) {
                highScore = score;
                highDisplay.innerText = highScore;
                localStorage.setItem('cosmic_dodge_high', highScore.toString());
            }

            menuTitle.innerText = "MISSION FAILED";
            menuTitle.style.background = "linear-gradient(135deg, #ef4444, #fca5a5)";
            menuTitle.style.webkitBackgroundClip = "text";
            menuDesc.innerText = `Your fighter was destroyed. \nFinal Score: ${score}`;
            startBtn.innerText = "Try Again";
            
            overlay.style.display = 'flex';
            setTimeout(() => { overlay.style.opacity = '1'; }, 10);
        }

        function gameLoopEngineTick() {
            if (gameState !== "PLAYING") return;

            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            ctx.fillStyle = '#0c0c0e';
            ctx.fillRect(0, 0, w, h);

            // Matrix Grid Tracker Backdrops
            ctx.strokeStyle = '#141419';
            ctx.lineWidth = 1;
            for (let i = 0; i < w; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
            }

            // Interpolated ship speed tracking glide logic
            player.x += (player.targetX - player.x) * 0.28;

            // Render Player Spaceship Starfighter
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#3b82f6';
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius);
            ctx.lineTo(player.x - player.radius, player.y + player.radius);
            ctx.lineTo(player.x, player.y + player.radius * 0.4);
            ctx.lineTo(player.x + player.radius, player.y + player.radius);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.radius * 0.8);
            ctx.lineTo(player.x - 5, player.y);
            ctx.lineTo(player.x + 5, player.y);
            ctx.closePath();
            ctx.fill();

            // Obstacles Spawn Loop Generators
            if (Math.random() < spawnRate) {
                const radius = Math.random() * 15 + 12;
                obstacles.push({
                    x: Math.random() * (w - radius * 2) + radius,
                    y: -radius,
                    radius: radius,
                    speed: Math.random() * 3 + obstacleSpeedBase
                });
            }

            // Update Frame Tracking Elements Loops
            ctx.fillStyle = '#ef4444';
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed;

                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ef4444';
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                ctx.fill();

                // Circle Math Matrix Frame Overlap Calculations
                const distX = obs.x - player.x;
                const distY = obs.y - player.y;
                const distance = Math.sqrt(distX * distX + distY * distY);

                if (distance < (obs.radius + player.radius * 0.72)) {
                    triggerGameOverSequence();
                    return;
                }

                if (obs.y - obs.radius > h) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreDisplay.innerText = score;

                    if (score % 15 === 0) {
                        obstacleSpeedBase += 0.4;
                        spawnRate += 0.003;
                    }
                }
            }

            ctx.shadowBlur = 0;
            animationFrameId = requestAnimationFrame(gameLoopEngineTick);
        }
    </script>
</body>
</html>
